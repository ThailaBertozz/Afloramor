<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Gerencial - Afloramor</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="icon" type="image/png" href="../assets/Afloramor.png">
  <style>
    body {
      display: flex;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #fefcfd;
    }

    .sidebar {
      width: 80px;
      background-color: #e67e9c;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: fixed;
      left: 0;
      top: 0;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    }

    .sidebar .logo {
      font-size: 24px;
      font-weight: bold;
      padding: 20px 0;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin-top: 30px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    .sidebar ul li {
      cursor: pointer;
      transition: 0.3s;
      border-radius: 10px;
      padding: 10px;
    }

    .sidebar ul li:hover {
      background-color: #f4b6c2;
    }

    .sidebar ul li.active {
      background-color: #ffe3eb;
      color: #e67e9c;
    }

    .sidebar svg {
      width: 24px;
      height: 24px;
      stroke: white;
    }

    .sidebar ul li.active svg {
      stroke: #e67e9c;
    }

    .logout {
      margin: 20px 0;
      background: white;
      color: #e67e9c;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      font-weight: 500;
    }

    .logout:hover {
      background-color: #ffe3eb;
    }

    .main {
      margin-left: 80px;
      padding: 30px;
      width: calc(100% - 80px);
    }

    h2 {
      color: #e67e9c;
      margin-bottom: 20px;
    }

    .filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filters input, .filters select {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    .dashboard-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin: 0;
      color: #555;
    }

    .card p {
      font-size: 24px;
      color: #e67e9c;
      margin: 10px 0 0;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .chart-container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    th, td {
      text-align: left;
      padding: 14px;
    }

    th {
      background-color: #e67e9c;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .section { display: none; }
    .section.active { display: block; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">🌸</div>
    <ul>
      <li class="active" onclick="showSection('dashboard', this)"><i data-lucide="bar-chart-3"></i></li>
      <li onclick="showSection('usuarios', this)"><i data-lucide="user-plus"></i></li>
      <li onclick="showSection('relatorios', this)"><i data-lucide="file-text"></i></li>
      <li onclick="showSection('config', this)"><i data-lucide="settings"></i></li>
    </ul>
    <button class="logout" onclick="logout()"><i data-lucide="log-out"></i></button>
  </div>

  <div class="main">
    <div id="dashboard" class="section active">
      <h2>Painel Gerencial</h2>
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Buscar doador...">
        <div style="display:flex;gap:10px;align-items:center">
          <select id="ongFilter">
            <option value="">Todas as ONGs</option>
          </select>
          <select id="monthFilter">
            <option value="">Todos os meses</option>
            <option value="Jan">Janeiro</option>
            <option value="Fev">Fevereiro</option>
            <option value="Mar">Março</option>
            <option value="Abr">Abril</option>
            <option value="Mai">Maio</option>
            <option value="Jun">Junho</option>
            <option value="Jul">Julho</option>
            <option value="Ago">Agosto</option>
            <option value="Set">Setembro</option>
            <option value="Out">Outubro</option>
            <option value="Nov">Novembro</option>
            <option value="Dez">Dezembro</option>
          </select>
        </div>
      </div>

      <div class="dashboard-cards">
        <div class="card"><h3>Total de Doações</h3><p id="totalDoacoes">R$ 0</p></div>
        <div class="card"><h3>Meta Mensal</h3><p>R$ 10.000</p></div>
        <div class="card"><h3>Voluntários Ativos</h3><p>23</p></div>
        <div class="card"><h3>Projetos Apoiados</h3><p>7</p></div>
      </div>

      <div class="chart-grid">
        <div class="chart-container"><h3>Doações por Mês</h3><canvas id="donationChart"></canvas></div>
        <div class="chart-container"><h3>Distribuição de Métodos</h3><canvas id="methodChart"></canvas></div>
        <div class="chart-container"><h3>Doações por ONG</h3><canvas id="ongChart"></canvas></div>
      </div>

      <h3>Últimas Doações</h3>
      <table>
        <thead><tr><th>Nome</th><th>Valor</th><th>Data</th><th>Método</th><th>ONG</th></tr></thead>
        <tbody id="donationTable"></tbody>
      </table>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // -- MOCK: doações de exemplo (contêm ONG)
    const mockadas = [
      { nome: "Maria Silva", valor: 120, data: "03/11/2025", metodo: "Pix", mes: "Nov", ong: "Ampara Animal" },
      { nome: "João Pedro", valor: 250, data: "02/11/2025", metodo: "Cartão", mes: "Nov", ong: "Instituto Luisa Mell" },
      { nome: "Ana Souza", valor: 90, data: "01/11/2025", metodo: "Pix", mes: "Nov", ong: "ONG Patinhas Felizes" },
      { nome: "Carlos Lima", valor: 300, data: "15/10/2025", metodo: "Boleto", mes: "Out", ong: "Ampara Animal" },
      { nome: "Beatriz N.", valor: 50, data: "10/09/2025", metodo: "Pix", mes: "Set", ong: "Instituto Luisa Mell" },
      { nome: "Rafael T.", valor: 400, data: "05/08/2025", metodo: "Cartão", mes: "Ago", ong: "ONG Patinhas Felizes" }
    ];

    // lê do localStorage (se tiver) — pode ter campo ong se veio da página de doação
    const doacoesSalvas = JSON.parse(localStorage.getItem('doacoes')) || [];
    // padroniza estrutura das doações salvas (garantir campos)
    const normalizedSaved = doacoesSalvas.map(d => ({
      nome: d.nome || 'Anônimo',
      valor: Number(d.valor) || 0,
      data: d.data || new Date().toLocaleDateString('pt-BR'),
      metodo: d.metodo || 'Pix',
      mes: d.mes || (new Date(d.data ? d.data.split('/').reverse().join('-') : undefined).toLocaleString('pt-BR', { month: 'short' }).replace('.', '')),
      ong: d.ong || 'Outros'
    }));

    let donations = [...mockadas, ...normalizedSaved];

    // atualiza lista de ONGs no filtro dinamicamente
    function populateOngFilter() {
      const ongSet = new Set(donations.map(d => d.ong || 'Outros'));
      const ongFilter = document.getElementById('ongFilter');
      ongFilter.innerHTML = '<option value=\"\">Todas as ONGs</option>';
      Array.from(ongSet).forEach(ong => {
        const opt = document.createElement('option');
        opt.value = ong;
        opt.innerText = ong;
        ongFilter.appendChild(opt);
      });
    }

    // renderiza a tabela com filtros de busca, mês e ONG
    function renderTable() {
      const tableBody = document.getElementById('donationTable');
      const searchInput = document.getElementById('searchInput');
      const monthFilter = document.getElementById('monthFilter');
      const ongFilter = document.getElementById('ongFilter');
      const term = searchInput.value.toLowerCase();
      const month = monthFilter.value;
      const ongSel = ongFilter.value;
      tableBody.innerHTML = '';

      let total = 0;
      donations
        .filter(d => d.nome.toLowerCase().includes(term))
        .filter(d => month === '' || d.mes === month)
        .filter(d => ongSel === '' || d.ong === ongSel)
        .forEach(d => {
          const row = document.createElement('tr');
          row.innerHTML = `<td>${d.nome}</td><td>R$ ${Number(d.valor).toFixed(2)}</td><td>${d.data}</td><td>${d.metodo}</td><td>${d.ong || '—'}</td>`;
          tableBody.appendChild(row);
          total += Number(d.valor);
        });

      document.getElementById('totalDoacoes').textContent = 'R$ ' + total.toFixed(2);
    }

    document.getElementById('searchInput').addEventListener('input', () => { renderTable(); updateCharts(); });
    document.getElementById('monthFilter').addEventListener('change', () => { renderTable(); updateCharts(); });
    document.getElementById('ongFilter').addEventListener('change', () => { renderTable(); updateCharts(); });

    populateOngFilter();
    renderTable();

    // --- Charts dynamic generation based on `donations` (considerando filtros atuais) ---
    function getFilteredDonationsForCharts() {
      const month = document.getElementById('monthFilter').value;
      const ongSel = document.getElementById('ongFilter').value;
      const term = document.getElementById('searchInput').value.toLowerCase();
      return donations.filter(d => d.nome.toLowerCase().includes(term))
                      .filter(d => month === '' || d.mes === month)
                      .filter(d => ongSel === '' || d.ong === ongSel);
    }

    // Monta array de meses (abreviados) na ordem Jan..Dez
    const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

    function computeMonthlyTotals(list) {
      const totals = months.map(m => 0);
      list.forEach(d => {
        const idx = months.indexOf(d.mes);
        if (idx >= 0) totals[idx] += Number(d.valor);
      });
      return totals;
    }

    function computeMethodCounts(list) {
      const counts = { Pix: 0, Cartão: 0, Boleto: 0, Outros: 0 };
      list.forEach(d => {
        const m = d.metodo || 'Outros';
        if (counts[m] !== undefined) counts[m]++; else counts.Outros++;
      });
      return counts;
    }

    function computeOngTotals(list) {
      const map = {};
      list.forEach(d => {
        const o = d.ong || 'Outros';
        map[o] = (map[o] || 0) + Number(d.valor);
      });
      return map;
    }

    // inicializa charts vazios
    const donationChartCtx = document.getElementById('donationChart').getContext('2d');
    const methodChartCtx = document.getElementById('methodChart').getContext('2d');
    const ongChartCtx = document.getElementById('ongChart').getContext('2d');

    let donationChart = new Chart(donationChartCtx, {
      type: 'bar',
      data: {
        labels: months,
        datasets: [{ label: 'Doações (R$)', data: computeMonthlyTotals(donations), backgroundColor: '#e67e9c' }]
      },
      options: { scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
    });

    let methodChart = new Chart(methodChartCtx, {
      type: 'doughnut',
      data: {
        labels: Object.keys(computeMethodCounts(donations)),
        datasets: [{ data: Object.values(computeMethodCounts(donations)), backgroundColor: ['#e67e9c', '#f4b6c2', '#ffe3eb', '#f7e7ea'] }]
      },
      options: { plugins: { legend: { position: 'bottom' } } }
    });

    function createOngChart(map) {
      const labels = Object.keys(map);
      const data = Object.values(map);
      return new Chart(ongChartCtx, {
        type: 'bar',
        data: { labels, datasets: [{ label: 'Total (R$)', data, backgroundColor: '#e67e9c' }] },
        options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { beginAtZero: true } } }
      });
    }

    let ongChart = createOngChart(computeOngTotals(donations));

    // atualiza charts com base nos filtros
    function updateCharts() {
      const filtered = getFilteredDonationsForCharts();
      // donationChart
      const monthly = computeMonthlyTotals(filtered);
      donationChart.data.datasets[0].data = monthly;
      donationChart.update();

      // methodChart
      const methodCounts = computeMethodCounts(filtered);
      methodChart.data.labels = Object.keys(methodCounts);
      methodChart.data.datasets[0].data = Object.values(methodCounts);
      methodChart.update();

      // ongChart: destrói e recria (para atualizar labels dinamicamente)
      ongChart.destroy();
      ongChart = createOngChart(computeOngTotals(filtered));
    }

    // atualiza quando inicia
    updateCharts();

    function logout() {
      alert('Logout realizado com sucesso!');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
