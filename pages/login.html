<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Afloramor</title>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/Afloramor.png">

  <style>
    /* base visual específico só para esta página (mantém style.css para o resto) */
    :root { --header-height: 72px; } /* ajuste fácil da altura do header */

    body {
      background-color: #fff8fa;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0; /* sem padding-top aqui para evitar empurrar o header */
      min-height: 100vh;
      display: block;
    }

    /* make header fixed to top */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      z-index: 1000;
      display: flex;
      align-items: center;
      /* if your external CSS already colors header, this won't override it;
         if needed, uncomment the background below:
      background: linear-gradient(90deg, rgba(233,30,99,0.95), rgba(194,24,91,0.95));
      */
    }

    /* ensure header-inner uses full height */
    .header-inner { height: 100%; display:flex; align-items:center; justify-content:space-between; }

    /* wrapper central que segura o conteúdo e centraliza o form.
       adicionamos margin-top igual à altura do header para que o conteúdo
       não fique escondido atrás dele */
    main.main-content {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      margin-top: var(--header-height);
      min-height: calc(100vh - var(--header-height));
      box-sizing: border-box;
    }

    .login-box {
      background-color: white;
      padding: 36px 28px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .login-box h2 {
      color: #e67e9c;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      box-sizing: border-box;
    }

    .login-box button {
      width: 100%;
      background-color: #e67e9c;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 500;
      transition: 0.18s;
    }

    .login-box button:hover {
      background-color: #f4b6c2;
    }

    .error {
      color: #e74c3c;
      margin-top: 10px;
      font-size: 14px;
      font-weight: 500;
    }

    /* Responsividade simples */
    @media (max-width:480px) {
      .login-box { padding: 26px 18px; }
      :root { --header-height: 64px; }
      main.main-content { margin-top: var(--header-height); }
    }
  </style>
</head>

<body>

  <!-- HEADER (padronizado e fixo no topo) -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="../index.html" class="logo">AFLORAMOR</a>
      </div>
      <nav class="main-nav">
        <a href="doeagora.html" class="btn btn-doar">Doe Agora</a>
        <a href="comodoar.html">Como doar?</a>
        <a href="cadastro.html" class="btn">Cadastro</a>
        <a href="login.html" class="btn">Login</a>
      </nav>
    </div>
  </header>

  <!-- MAIN: wrapper que centraliza o conteúdo abaixo do header -->
  <main class="main-content">
    <div class="login-box" role="region" aria-label="Formulário de login">
      <h2>Login Afloramor</h2>

      <form id="loginForm" autocomplete="on" novalidate>
        <input type="text" id="usuario" name="usuario" placeholder="Usuário (e-mail)" required autocomplete="username">
        <input type="password" id="senha" name="senha" placeholder="Senha" required autocomplete="current-password">
        <button type="submit" aria-label="Entrar">Entrar</button>
        <p class="error" id="mensagemErro" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const usuario = document.getElementById("usuario").value.trim();
      const senha = document.getElementById("senha").value.trim();
      const mensagemErro = document.getElementById("mensagemErro");

      const usuarioPadrao = "f5";
      const senhaPadrao = "12345";

      if (usuario === usuarioPadrao && senha === senhaPadrao) {
        mensagemErro.style.color = "#4CAF50";
        mensagemErro.innerText = "Login realizado com sucesso!";
        setTimeout(() => {
          window.location.href = "home.html";
        }, 1000);
      } else {
        mensagemErro.style.color = "#e74c3c";
        mensagemErro.innerText = "Usuário ou senha incorretos!";
      }
    });
  </script>

</body>
</html>
